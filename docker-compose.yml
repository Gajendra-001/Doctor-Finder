services:
  web:
    build: .
    container_name: django_app
    command: gunicorn --bind 0.0.0.0:8000 doctor_finder.wsgi:application
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles  # Mount static files
    expose:
      - "8000"

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles  # Mount static files
    depends_on:
      - web